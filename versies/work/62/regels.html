<div id="regelsview">
    <p style="margin:0 0 10px"><a class="pill" href="index.html">&#8592; Terug naar de app</a></p>
    <h2>Mijn regels</h2>
    <p class="hint" style="margin:0 0 10px">Bepaal zelf welke eetmomenten een dag heeft: wat je hier invult, staat op de dagkaart in de Week. Een dag zonder eigen momenten blijft leeg. Zet bij een moment het ⚡-vinkje als de ⚡-knop het moet vullen met je vaste producten.</p>
    <div class="rgl-dagen" id="rglDagen"></div>

<style>
.rgl-dagen { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
.rgl-dag { border: 1.5px solid var(--line); background: none; color: var(--fg); font: 600 13px inherit; padding: 8px 12px; border-radius: 99px; cursor: pointer; position: relative; }
.rgl-dag.actief { background: var(--soft); border-color: var(--fg); }
.rgl-dag .stip { position: absolute; top: 4px; right: 6px; font-size: 10px; }
.rgl-mom { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.rgl-mom .naam { display: flex; align-items: center; gap: 6px; }
.rgl-mom .naam input { flex: 1; border: none; background: none; color: var(--fg); font: 700 15px inherit; padding: 2px 0; }
.rgl-mom .naam input:focus { outline: none; border-bottom: 1.5px solid var(--fg); }
.rgl-mom .tijd { border: none; background: none; color: var(--muted); font: 400 13px inherit; padding: 0; width: 100%; margin-top: 2px; }
.rgl-mom .tijd:focus { outline: none; color: var(--fg); }
.rgl-mom .rij { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.rgl-mom .rij label { color: var(--muted); font-size: 13px; font-weight: 600; }
.rgl-mom .rij input { width: 90px; border: 1.5px solid var(--line); background: none; color: var(--fg); font: 600 15px inherit; padding: 6px 8px; border-radius: 8px; text-align: right; }
.rgl-mom .verw { margin-left: auto; border: none; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 6px 8px; border-radius: 99px; }
.rgl-mom .verw:focus { background: var(--soft); }
.rgl-totaal { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
.rgl-totaal b { color: var(--fg); }
.rgl-leeg { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.rgl-mom .rij label.normlbl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.rgl-mom .rij label.normlbl input { width: 18px; height: 18px; flex: none; }
</style>
<script>
(function () {
  // Regels-pagina (proef, app-test-work) — v60.0 - 15 nov 17u57: eigen eetmomenten per dag + ⚡-vinkje voor Mijn normale dag.
  // Opslag in eigen sleutel 'eetweek.regels.v1': raakt nooit de echte app-data.
  var KEY = 'eetweek.regels.v1';
  var DAGEN = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  var DAGNAAM = { ma: 'Maandag', di: 'Dinsdag', wo: 'Woensdag', do: 'Donderdag', vr: 'Vrijdag', za: 'Zaterdag', zo: 'Zondag' };
  var geselecteerd = 'ma';
  var verwBezig = null;
  var verwLeegBezig = false;
  function laad() {
    try { var o = JSON.parse(localStorage.getItem(KEY) || '{}'); return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {}; }
    catch (e) { return {}; }
  }
  function bewaar(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  var data = laad();
  function momenten(dag) { return Array.isArray(data[dag]) ? data[dag] : []; }
  function num(v) { var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); return isFinite(n) && n > 0 ? n : null; }
  function pasThemaToe() {
    var t = null; try { t = localStorage.getItem('eetweek.thema'); } catch (e) {}
    var root = document.documentElement;
    if (t === 'light' || t === 'dark' || t === 'contrast') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === (t || 'auto'))); });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-theme-set]') : null; if (!b) return;
    var t = b.getAttribute('data-theme-set'); if (t === 'auto') t = '';
    try { t ? localStorage.setItem('eetweek.thema', t) : localStorage.removeItem('eetweek.thema'); } catch (e) {}
    pasThemaToe();
  });
  pasThemaToe();
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function renderDagen() {
    var h = '';
    DAGEN.forEach(function (d) {
      h += '<button type="button" class="rgl-dag' + (d === geselecteerd ? ' actief' : '') + '" data-dag="' + d + '">' + DAGNAAM[d].slice(0, 2) +
        (momenten(d).length ? ' <span class="stip">&#9679;</span>' : '') + '</button>';
    });
    document.getElementById('rglDagen').innerHTML = h;
  }
  function totaalRegel(lijst) {
    var tot = 0, erIs = false;
    lijst.forEach(function (m) { if (m.kcal != null) { tot += m.kcal; erIs = true; } });
    return erIs ? 'Samen op deze dag: <b>' + tot + ' kcal</b> (alleen de momenten met een getal).' : 'Nog geen maximum ingesteld. Vul in wat bij jou past, of laat het leeg.';
  }
  function renderDag() {
    var lijst = momenten(geselecteerd), h = '<h3>' + DAGNAAM[geselecteerd] + '</h3>';
    if (!lijst.length) h += '<p class="rgl-leeg">Nog geen eigen momenten op deze dag. Voeg ze hier toe; in de Week blijft deze dag verder leeg.</p>';
    lijst.forEach(function (m) {
      var verw = verwBezig === m.id;
      h += '<div class="rgl-mom" data-mid="' + m.id + '">' +
        '<div class="naam"><input type="text" maxlength="30" autocomplete="off" data-f="naam" value="' + esc(m.naam) + '" placeholder="Naam van het moment" aria-label="Naam van het moment">' +
        '<button type="button" class="verw" data-mid="' + m.id + '" title="' + (verw ? 'Nog een keer tikken om te verwijderen' : 'Verwijderen') + '">' + (verw ? '&#10062; zeker?' : '&#128465;') + '</button></div>' +
        '<input type="text" class="tijd" maxlength="30" autocomplete="off" data-f="tijd" value="' + esc(m.tijd || '') + '" placeholder="Tijd of moment, bijvoorbeeld rond 09:00" aria-label="Tijd of moment">' +
        '<div class="rij"><label for="k' + m.id + '">max kcal</label>' +
        '<input id="k' + m.id + '" type="text" inputmode="numeric" autocomplete="off" data-f="kcal" value="' + (m.kcal != null ? m.kcal : '') + '" aria-label="Maximum in kcal">' +
        '</div>' +
        '<div class="rij"><label class="normlbl"><input type="checkbox" data-f="norm"' + (m.norm ? ' checked' : '') + '> ⚡ in Mijn normale dag — de ⚡-knop vult dit moment met je vaste producten</label></div></div>';
    });
    h += '<div class="seg" style="margin-top:10px"><button type="button" class="pill" data-act="rgltoevoegen">+ Eigen moment toevoegen</button>' +
      (lijst.length ? '<button type="button" class="pill" data-act="rglleeg" style="margin-left:6px">Deze dag leegmaken</button>' : '') + '</div>';
    h += '<p class="rgl-totaal">' + totaalRegel(lijst) + '</p>';
    document.getElementById('rglDag').innerHTML = h;
  }
  function render() { renderDagen(); renderDag(); }
  document.getElementById('regelsview').addEventListener('click', function (ev) {
    var el = ev.target;
    var dagBtn = el.closest ? el.closest('[data-dag]') : null;
    if (dagBtn) { geselecteerd = dagBtn.getAttribute('data-dag'); verwBezig = null; verwLeegBezig = false; render(); return; }
    var verwBtn = el.closest ? el.closest('.verw') : null;
    if (verwBtn) {
      var mid = verwBtn.getAttribute('data-mid');
      if (verwBezig === mid) {
        data[geselecteerd] = momenten(geselecteerd).filter(function (m) { return m.id !== mid; });
        verwBezig = null; bewaar(data); render();
      } else { verwBezig = mid; render(); }
      return;
    }
    if (el.closest && el.closest('[data-act="rgltoevoegen"]')) {
      var nwe = { id: 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1000), naam: '', tijd: '', kcal: null, norm: false };
      if (!Array.isArray(data[geselecteerd])) data[geselecteerd] = [];
      data[geselecteerd].push(nwe); verwBezig = null; verwLeegBezig = false; bewaar(data); render();
      var inp = document.querySelector('.rgl-mom[data-mid="' + nwe.id + '"] input[data-f="naam"]'); if (inp) inp.focus();
      return;
    }
    if (el.closest && el.closest('[data-act="rglleeg"]')) {
      if (verwLeegBezig) { delete data[geselecteerd]; verwLeegBezig = false; verwBezig = null; bewaar(data); render(); }
      else { verwLeegBezig = true; render(); var b = document.querySelector('[data-act="rglleeg"]'); if (b) { b.textContent = 'Echt alles van deze dag weg?'; b.focus(); } }
    }
  });
  document.getElementById('regelsview').addEventListener('change', function (ev) {
    var inp = ev.target; if (!inp.getAttribute || inp.getAttribute('data-f') !== 'norm') return;
    var doos = inp.closest('.rgl-mom'); if (!doos) return;
    var mid = doos.getAttribute('data-mid');
    var lijst = momenten(geselecteerd); var m = null;
    for (var i = 0; i < lijst.length; i++) if (lijst[i].id === mid) m = lijst[i];
    if (!m) return;
    m.norm = !!inp.checked;
    bewaar(data);
  });
  document.getElementById('regelsview').addEventListener('input', function (ev) {
    var inp = ev.target; if (!inp.getAttribute || !inp.getAttribute('data-f')) return;
    var doos = inp.closest('.rgl-mom'); if (!doos) return;
    var mid = doos.getAttribute('data-mid'), f = inp.getAttribute('data-f');
    var lijst = momenten(geselecteerd); var m = null;
    for (var i = 0; i < lijst.length; i++) if (lijst[i].id === mid) m = lijst[i];
    if (!m) return;
    if (f === 'naam') m.naam = inp.value;
    else if (f === 'tijd') m.tijd = inp.value;
    else if (f === 'kcal') m.kcal = num(inp.value);
    bewaar(data);
    if (f === 'kcal') { var t = document.querySelector('.rgl-totaal'); if (t) t.innerHTML = totaalRegel(lijst); }
  });
  render();
})();
</script>
