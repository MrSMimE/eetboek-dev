<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mijn Eetboek — Zelftest work v58.10</title>
</head>
<body>
<p>Zelftest work-versie laden…</p>
<script>
(function () {
  // Zelftest-work v58.10: laadt de echte index.html en past meteen aan:
  // - test-modus aan (schrijft alleen naar eetweek.v1.testversie)
  // - Regels-knop in de footer (linkt naar regels-zelftest-work.html)
  // - versie + datum + tijd naar v58.10 - 15 nov 10u10
  // - eigen testpunten (Deel 6) voor de nieuwe werk-onderdelen
  // Jouw echte eetboek blijft volledig onaangeraakt.
  var x = new XMLHttpRequest();
  x.open('GET', 'index.html', true);
  x.onload = function () {
    var t = x.responseText;
    var ok = [];
    // 1. test-modus aan
    ok.push(t.indexOf('var TESTVERSIE = false;') !== -1);
    t = t.replace('var TESTVERSIE = false;', 'var TESTVERSIE = true; // zelftest-work v58.10: schrijft alleen naar test-opslag');
    // 2. Regels-knop in de footer, vóór Testen
    var OUD = '<footer class="appfoot"><button type="button" data-act="tab" data-t="test" id="tabtest">🧪 Testen</button></footer>';
    var NIEUW = '<footer class="appfoot"><a href="regels-zelftest-work.html">📋 Regels</a> <button type="button" data-act="tab" data-t="test" id="tabtest">🧪 Testen</button></footer>';
    ok.push(t.indexOf(OUD) !== -1);
    t = t.replace(OUD, NIEUW);
    // 3. versie + datum + tijd naar v58.10
    ok.push(t.indexOf("var VERSION = 'v58.9 - 14 nov 20u55';") !== -1);
    t = t.replace("var VERSION = 'v58.9 - 14 nov 20u55';", "var VERSION = 'v58.10 - 15 nov 10u10';");
    ok.push(t.indexOf("VERSION = 'v58.9 - 14 nov 20u55 (testbuild 14 nov 20u55)';") !== -1);
    t = t.replace("VERSION = 'v58.9 - 14 nov 20u55 (testbuild 14 nov 20u55)';", "VERSION = 'v58.10 - 15 nov 10u10 (testbuild 15 nov 10u10)';");
    // 4. eigen testpunten voor v58.10 toevoegen (Deel 6)
    var OPEN = 'var VERS_TESTEN = [';
    var PUNTEN =
      '    {"versie":"v58.10","deel":6,"t":"Eigen Regels-pagina (v58.10)","sub":"knop 📋 Regels onderaan, vóór 🧪 Testen; opent de eigen Regels-work-pagina; ← Terug naar de app komt hier terug","doen":"Tik onderaan op 📋 Regels. Opent de Regels-pagina met dag-chips ma t/m zo? Voeg op een dag een eigen moment toe, hernoem het, vul kcal in en kijk of de totaalregel meetelt. Tik ← Terug naar de app: ben je terug in de werk-app?"},' +
      '    {"versie":"v58.10","deel":6,"t":"Aparte opslag voor de werk-versies","sub":"alles wat je in de werk-app en in Regels-work invult gaat naar aparte opslag (eetweek.v1.testversie en eetweek.regels.zelftestwork.v1); je echte eetboek blijft buiten schot","doen":"Vul iets in de werk-app. Open daarna je gewone app: staat de verandering daar níet? Dat is de bedoeling."},' +
      '    {"versie":"v58.10","deel":6,"t":"Versie-regel toont v58.10","sub":"testpagina begint met v58.10 · 6 delen · punten · nagekeken-teller","doen":"Open het Testen-blokje: begint de samenvattingsregel bovenaan met v58.10 en telt hij 6 delen?"},' +
      '\n';
    ok.push(t.indexOf(OPEN) !== -1);
    t = t.replace(OPEN, OPEN + '\n' + PUNTEN);
    // 5. deel-nummer tot 9 toestaan zodat Deel 6 zijn eigen blokje krijgt
    ok.push(t.indexOf('Math.min(5, Math.max(1, VERS_TESTEN[i].deel || 1))') !== -1);
    t = t.split('Math.min(5, Math.max(1, VERS_TESTEN[i].deel || 1))').join('Math.min(9, Math.max(1, VERS_TESTEN[i].deel || 1))');
    document.open();
    document.write(t);
    document.close();
    if (ok.indexOf(false) !== -1) { try { console.warn('zelftest-work: niet alle v58.10-aanpassingen gelukt — controleer de code'); } catch (e) {} }
  };
  x.onerror = function () {
    document.body.innerHTML = '<p>Kon index.html niet laden. Kijk even of je internetverbinding het doet en probeer opnieuw.</p>';
  };
  x.send();
})();
</script>
</body>
</html>
