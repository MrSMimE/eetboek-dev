# Kliktest-work (publieke repo) - v2 (15 nov 2026, Vibe Work)
# Handmatig te starten kliktest die ALLÉÉN de werk-set pakt.
# ZONDER AI/Mistral-stuff: geen live-opzoek, geen Mistral-aanroepen, geen AI-jury.
# Kern-ronde (tabbalk, recepten, ⋮-menu, kookhulp, producten, instellingen, breedte)
# + Ronde W: alle nieuwe aanpassingen (v58.10 Regels + aparte opslag, v59.0 rustige
#   testpagina + permanente vinkjes + Archief + Regels-kaartje permanent).
# De echte index.html wordt nooit gewijzigd.
name: Kliktest-work

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kliktest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Playwright-gereedschap (eerste keer +/- 2-3 min)
        shell: bash
        run: |
          cd versies/tests
          npm init -y >/dev/null
          npm i playwright --no-fund --no-audit
          npx playwright install chromium

      - name: Controleer de werk-set
        shell: bash
        run: |
          for f in index-zelftest-work.html regels-zelftest-work.html index.html app-test-work/regels.html versies/tests/kliktest-work.js; do
            if [ ! -f "$f" ]; then
              echo "STORING: geen $f op de Test-branch."
              exit 1
            fi
          done

      - name: Vinger-kliktest werk-set (+/- 1-3 min)
        shell: bash
        timeout-minutes: 30
        run: |
          cd versies/tests
          node kliktest-work.js

      - name: Rapport tonen in de log
        if: always()
        shell: bash
        run: |
          for f in versies/tests/rapport-laatste-work/*.md; do
            echo "================ ${f##*/} ================"
            cat "$f" 2>/dev/null || echo "(niet aanwezig)"
          done

      - name: Rapport als artifact bewaren (14 dagen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kliktest-work-rapport
          path: versies/tests/rapport-laatste-work/
          retention-days: 14
