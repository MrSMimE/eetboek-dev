# Kliktest-work (publieke repo) - v3 (15 nov 2026, Vibe Work)
# Handmatig te starten kliktest: de VOLLEDIGE echte kliktest op de werk-set,
# ZONDER AI/Mistral-stuff (Ronde 3 en Ronde 8 zijn bewust weg) + Ronde W
# (v58.10 Regels + aparte opslag, v59.0 rustige testpagina + permanente
# vinkjes + Archief + Regels-kaartje permanent).
# Duurt +/- 10-25 min (de volledige ronde). De echte index.html wordt niet gewijzigd.
name: Kliktest-work

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kliktest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Test

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Playwright-gereedschap (eerste keer +/- 2-3 min)
        shell: bash
        run: |
          cd versies/tests
          npm init -y >/dev/null
          npm i playwright --no-fund --no-audit
          npx playwright install chromium

      - name: Controleer de werk-set
        shell: bash
        run: |
          for f in app.html regels-zelftest-work.html index.html app-test-work/regels.html; do
            if [ ! -f "$f" ]; then
              echo "STORING: geen $f op de Test-branch."
              exit 1
            fi
          done

      - name: Volledige vinger-kliktest werk-set (10-25 min)
        shell: bash
        timeout-minutes: 50
        run: |
          cd versies/tests
          if [ ! -f kliktest-work.js ]; then
            echo "kliktest-work.js staat (nog) niet in de publieke repo (komt via de sync) — werk-kliktest overgeslagen."
            exit 0
          fi
          node kliktest-work.js

      - name: Rapport tonen in de log
        if: always()
        shell: bash
        run: |
          for f in versies/tests/rapport-laatste-work/*.md; do
            echo "================ ${f##*/} ================"
            cat "$f" 2>/dev/null || echo "(niet aanwezig)"
          done

      - name: Rapport als artifact bewaren (14 dagen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kliktest-work-rapport
          path: versies/tests/rapport-laatste-work/
          retention-days: 14
