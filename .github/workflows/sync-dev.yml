name: Sync dev naar default branch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

env:
  SOURCE_REPO: MrSMimE/Mijn-eetboek-app-
  SOURCE_DIR: /tmp/eetboek-app
  TARGET_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch van publieke repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Diagnose (token + toegang, zonder geheimen te onthullen)
        run: |
          echo "### Sync-diagnose" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.SYNC_TOKEN }}" ]; then
            echo "- SYNC_TOKEN secret: ingesteld \u2705" >> $GITHUB_STEP_SUMMARY
          else
            echo "- SYNC_TOKEN secret: LEEG of ontbreekt \u274c" >> $GITHUB_STEP_SUMMARY
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" https://api.github.com/repos/MrSMimE/Mijn-eetboek-app-)
          echo "- API-toegang tot de priv\u00e9-repo: HTTP $code" >> $GITHUB_STEP_SUMMARY
          case "$code" in
            200) echo "  -> 200 = token mag de repo zien, prima!" >> $GITHUB_STEP_SUMMARY ;;
            401) echo "  -> 401 = token ongeldig/verlopen, of met een spatie/enter geplakt" >> $GITHUB_STEP_SUMMARY ;;
            404) echo "  -> 404 = token mag deze repo NIET zien (repository access of Contents-permission)" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "  -> onbekende code, kijk op de bovenstaande regel" >> $GITHUB_STEP_SUMMARY ;;
          esac

      - name: Check of er een nieuwe commit op de bron-branch staat (via API)
        id: check
        run: |
          api="https://api.github.com/repos/${{ env.SOURCE_REPO }}"
          auth="Authorization: Bearer ${{ secrets.SYNC_TOKEN }}"
          new_sha=$(curl -s -H "$auth" "$api/branches/Eetboek" | jq -r '.commit.sha // empty')
          if [ -z "$new_sha" ]; then
            default_ref=$(curl -s -H "$auth" "$api" | jq -r '.default_branch // empty')
            if [ -n "$default_ref" ]; then
              new_sha=$(curl -s -H "$auth" "$api/branches/$default_ref" | jq -r '.commit.sha // empty')
            fi
          fi
          if [ -z "$new_sha" ]; then
            echo "Kon geen branch-sha ophalen uit ${{ env.SOURCE_REPO }}" >&2
            exit 1
          fi
          old_sha=$(cat .sync-sha 2>/dev/null || true)
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$old_sha" ] && [ "$old_sha" = "$new_sha" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Geen nieuwe commit (${new_sha:0:7}); kopiëren en testen worden overgeslagen."
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Nieuwe commit: ${new_sha:0:7} (vorige: ${old_sha:-geen})"
          fi

      - name: Download prive-repository als tarball (werkt met fine-grained token)
        if: steps.check.outputs.should_sync == 'true'
        run: |
          mkdir -p "${{ env.SOURCE_DIR }}"
          curl -sL -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            "https://api.github.com/repos/${{ env.SOURCE_REPO }}/tarball/Eetboek" \
            | tar xz --strip-components=1 -C "${{ env.SOURCE_DIR }}"
          if [ ! -f "${{ env.SOURCE_DIR }}/app-test/index-zelftest.html" ]; then
            echo "STORING: download mislukt - geen app-test/index-zelftest.html in de tarball" >&2
            exit 1
          fi

      - name: Controleer bronmap versies/ (opdeling-test als losse bestanden)
        if: steps.check.outputs.should_sync == 'true'
        run: |
          if [ ! -f "${{ env.SOURCE_DIR }}/versies/opdeling-test/index-zelftest.html" ]; then
            echo "versies/opdeling-test (losse bestanden) niet gevonden in ${{ env.SOURCE_REPO }}" >&2
            exit 1
          fi

      - name: Verwijder oude kopieen
        if: steps.check.outputs.should_sync == 'true'
        run: |
          rm -rf ./versies ./app-test ./tests

      - name: Kopieer versies/ (opdeling-test los, zonder zips) + README (strikte uitsluitingen)
        if: steps.check.outputs.should_sync == 'true'
        run: |
          EXCLUDES=(
            --exclude='.git'
            --exclude='.env*'
            --exclude='*.pem' --exclude='*.key' --exclude='*.p12' --exclude='*.pfx'
            --exclude='secrets' --exclude='secrets.*' --exclude='credentials*'
            --exclude='*.zip'
            --exclude='node_modules/'
          )
          rsync -a "${EXCLUDES[@]}" "${{ env.SOURCE_DIR }}/versies/" ./versies/
          if [ -f "${{ env.SOURCE_DIR }}/README.md" ]; then
            rsync -a --exclude='.git' --exclude='.env*' "${{ env.SOURCE_DIR }}/README.md" ./README.md
          fi
          if [ -f "${{ env.SOURCE_DIR }}/.gitignore" ]; then
            rsync -a "${{ env.SOURCE_DIR }}/.gitignore" ./.gitignore
          fi

      - name: Commit en push rechstreeks naar default branch (zonder PR)
        if: steps.check.outputs.should_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.check.outputs.new_sha }}" > .sync-sha
          git add -A
          if git diff --cached --quiet; then
            echo "Geen wijzigingen, niets te pushen."
          else
            git commit -m "Sync dev: versies/ (opdeling-test los) @ ${{ steps.check.outputs.new_sha }}"
            git push origin "HEAD:${{ env.TARGET_BRANCH }}"
          fi

      - name: Start klikbot-test
        if: steps.check.outputs.should_sync == 'true'
        run: |
          if [ -d ./versies/tests ]; then
            cd ./versies/tests
          elif [ -d "${{ env.SOURCE_DIR }}/tests" ]; then
            cd "${{ env.SOURCE_DIR }}/tests"
          else
            echo "Geen versies/tests of tests/ gevonden om de klikbot te starten" >&2
            exit 1
          fi
          if [ -f package.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
            script=$(npm run 2>/dev/null | grep -io 'kliktest[a-z0-9-]*\|clickbot[a-z0-9-]*' | head -n 1)
            if [ -n "$script" ]; then
              npm run "$script"
            else
              npm test
            fi
          else
            f=$(ls *draai*.sh *kliktest*.sh *clickbot*.sh *bot*.sh 2>/dev/null | head -n 1)
            if [ -z "$f" ]; then
              f=$(ls *kliktest* *clickbot* 2>/dev/null | head -n 1)
            fi
            if [ -z "$f" ]; then
              f=$(ls *bot* 2>/dev/null | head -n 1)
            fi
            if [ -n "$f" ]; then
              case "$f" in
                *.js) node "$f" ;;
                *.py) python "$f" ;;
                *.sh) bash "$f" ;;
                *) echo "Onbekend testformaat: $f" >&2; exit 1 ;;
              esac
            elif compgen -G 'test_*.py' > /dev/null || compgen -G '*_test.py' > /dev/null; then
              python -m pytest -v
            else
              echo "Geen klikbot-test gevonden" >&2
              exit 1
            fi
          fi
