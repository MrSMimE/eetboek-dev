name: Sync en test

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: MrSMimE/Mijn-eetboek-app-
  SOURCE_DIR: /tmp/eetboek-app

jobs:
  sync-en-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publieke repository
        uses: actions/checkout@v4

      - name: Clone prive-repository met SYNC_TOKEN
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ env.SOURCE_REPO }}.git" \
            "${{ env.SOURCE_DIR }}"
          git -C "${{ env.SOURCE_DIR }}" config --unset-all http.https://github.com/.extraheader || true

      - name: Controleer bronmappen tests/ en versies/
        run: |
          for d in tests versies; do
            if [ ! -d "${{ env.SOURCE_DIR }}/$d" ]; then
              echo "Map '$d' niet gevonden in ${SOURCE_REPO}" >&2
              exit 1
            fi
          done

      - name: Verwijder oude tests/ en versies/ uit publieke repo
        run: |
          rm -rf ./tests ./versies

      - name: Kopieer tests/, versies/, README.md en .gitignore (strikte uitsluitingen)
        run: |
          EXCLUDES=(
            --exclude='.git'
            --exclude='.env*'
            --exclude='*.pem' --exclude='*.key' --exclude='*.p12' --exclude='*.pfx'
            --exclude='secrets' --exclude='secrets.*' --exclude='credentials*'
            --exclude='server/' --exclude='backend/' --exclude='api/'
            --exclude='node_modules/'
          )
          rsync -a "${EXCLUDES[@]}" "${{ env.SOURCE_DIR }}/tests/" ./tests/
          rsync -a "${EXCLUDES[@]}" "${{ env.SOURCE_DIR }}/versies/" ./versies/
          if [ -f "${{ env.SOURCE_DIR }}/README.md" ]; then
            rsync -a --exclude='.git' --exclude='.env*' "${{ env.SOURCE_DIR }}/README.md" ./README.md
          fi
          if [ -f "${{ env.SOURCE_DIR }}/.gitignore" ]; then
            rsync -a "${{ env.SOURCE_DIR }}/.gitignore" ./.gitignore
          fi

      - name: Commit en push veilige bestanden naar publieke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen wijzigingen, niets te pushen."
          else
            git commit -m "Sync: tests/ + versies/ (+ README/.gitignore) uit prive-repo"
            git push
          fi

      - name: Start klikbot vanuit tests/
        working-directory: tests
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
            script=$(npm run 2>/dev/null | grep -io 'kliktest[a-z0-9-]*\|clickbot[a-z0-9-]*' | head -n 1)
            if [ -n "$script" ]; then
              npm run "$script"
            else
              npm test
            fi
          else
            f=$(ls *kliktest* *clickbot* 2>/dev/null | head -n 1)
            if [ -z "$f" ]; then
              f=$(ls *bot* 2>/dev/null | head -n 1)
            fi
            if [ -n "$f" ]; then
              case "$f" in
                *.js) node "$f" ;;
                *.py) python "$f" ;;
                *.sh) bash "$f" ;;
                *) echo "Onbekend testformaat: $f" >&2; exit 1 ;;
              esac
            elif compgen -G 'test_*.py' > /dev/null || compgen -G '*_test.py' > /dev/null; then
              python -m pytest -v
            else
              echo "Geen klikbot-test gevonden in tests/" >&2
              exit 1
            fi
          fi
